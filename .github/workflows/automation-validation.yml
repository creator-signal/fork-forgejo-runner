name: Runner automation validation

on:
  pull_request:
    branches:
      - creator-signal/automation
    paths:
      - .github/workflows/**
      - creator-signal/**
      - docs/creator-signal-runner-release.md
      - scripts/creator-signal/**
  push:
    branches:
      - creator-signal/automation
    paths:
      - .github/workflows/**
      - creator-signal/**
      - docs/creator-signal-runner-release.md
      - scripts/creator-signal/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-automation-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Deterministic workflow contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out automation change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run release-control tests
        run: python3 -m unittest scripts/creator-signal/test_release_control.py
      - name: Enforce workflow and supply-chain contracts
        run: python3 scripts/creator-signal/check_workflow_contract.py
      - name: Exercise live upstream synchronization dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/creator-signal/release_control.py sync
          --mode dry-run
          --repository "${GITHUB_REPOSITORY}"
          --report upstream-sync-ci-dry-run.json
      - name: Install checksum-pinned actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir actionlint-bin
          tar -xzf "$archive" -C actionlint-bin actionlint
      - name: Lint GitHub workflows
        run: actionlint-bin/actionlint -color
      - name: Preserve synchronization dry-run report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: upstream-sync-ci-dry-run-${{ github.run_id }}
          path: upstream-sync-ci-dry-run.json
          if-no-files-found: warn
          retention-days: 14

  security:
    name: GitHub Actions security analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out automation change
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Audit workflows with pinned zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          version: 1.29.0
          persona: pedantic
          min-severity: medium
          min-confidence: high
          online-audits: false
          advanced-security: false
          annotations: false

  initial-release-qualification:
    name: Initial v13.0.0 release qualification
    needs: [contracts, security]
    uses: ./.github/workflows/runner-qualification.yml
    with:
      tag: v13.0.0
    permissions:
      contents: read
