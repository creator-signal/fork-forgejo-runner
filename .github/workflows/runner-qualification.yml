name: Governed Runner qualification
run-name: Qualify Runner ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        description: Exact synchronized upstream semantic-version tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runner-qualification-${{ inputs.tag }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    name: Verify exact upstream source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.plan.outputs.source_sha }}
      tag-object-sha: ${{ steps.plan.outputs.tag_object_sha }}
      version: ${{ steps.plan.outputs.version }}
      source-epoch: ${{ steps.epoch.outputs.value }}
      module-path: ${{ steps.plan.outputs.module_path }}
      go-version: ${{ steps.plan.outputs.go_version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      release-exists: ${{ steps.plan.outputs.release_exists }}
      release-complete: ${{ steps.plan.outputs.release_complete }}
      release-draft: ${{ steps.plan.outputs.release_draft }}
      backport-commit: ${{ steps.plan.outputs.backport_commit }}
      backport-pull-request: ${{ steps.plan.outputs.backport_pull_request }}
      backport-patch-sha256: ${{ steps.plan.outputs.backport_patch_sha256 }}
      patched-source-tree-sha: ${{ steps.plan.outputs.patched_source_tree_sha }}
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
          fetch-depth: 0
          persist-credentials: false

      - name: Verify mirrored tag and derive source toolchain
        id: plan
        working-directory: automation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 scripts/creator-signal/release_control.py plan-tag
          --tag "${RELEASE_TAG}"
          --repository "${GITHUB_REPOSITORY}"
          --report ../source-plan.json

      - name: Derive deterministic source epoch
        id: epoch
        working-directory: automation
        env:
          SOURCE_SHA: ${{ steps.plan.outputs.source_sha }}
        run: |
          epoch=$(git show -s --format=%ct "$SOURCE_SHA")
          echo "value=$epoch" >> "$GITHUB_OUTPUT"

      - name: Preserve source plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-source-plan-${{ inputs.tag }}
          path: source-plan.json
          retention-days: 14

  build-linux-amd64:
    name: Linux amd64 native build, tests and smoke
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
          persist-credentials: false
      - name: Check out exact mirrored source tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out source commit
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Apply exact governed upstream source backport
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: >-
          python3 automation/scripts/creator-signal/apply_source_backport.py
          --source source
          --tag "${RELEASE_TAG}"
          --source-sha "${SOURCE_SHA}"
          --expected-commit "${BACKPORT_COMMIT}"
          --expected-patch-sha256 "${BACKPORT_PATCH_SHA256}"
          --expected-tree-sha "${PATCHED_SOURCE_TREE_SHA}"
      - name: Install exact declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.source.outputs.go-version }}
          cache-dependency-path: source/go.sum
      - name: Prepare native Linux container test features
        working-directory: source
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo act/runner/lxc-helpers.sh lxc_prepare_environment
          sudo apt-get install -y -qq debian-archive-keyring
          sudo install -m 0644 \
            /usr/share/keyrings/debian-archive-bookworm-stable.gpg \
            /etc/apt/trusted.gpg.d/debian-archive-bookworm-stable.gpg
          sudo act/runner/lxc-helpers.sh lxc_install_lxc_inside 10.39.28 fdb1
          mapfile -t lxc_addresses < <(
            ip -o -4 addr show dev lxcbr0 scope global | awk '{print $4}'
          )
          if [[ "${#lxc_addresses[@]}" -ne 1 ]]; then
            echo "Expected one global IPv4 address on lxcbr0, found ${#lxc_addresses[@]}" >&2
            exit 1
          fi
          lxc_address="${lxc_addresses[0]}"
          if ! lxc_subnet="$(python3 -c 'import ipaddress, sys; interface = ipaddress.ip_interface(sys.argv[1]); assert interface.version == 4 and interface.ip.is_private and interface.network.prefixlen == 24; print(interface.network.with_prefixlen)' "$lxc_address")"; then
            echo "Invalid or unsafe lxcbr0 IPv4 CIDR: $lxc_address" >&2
            exit 1
          fi
          mapfile -t egress_interfaces < <(
            ip -4 route show default |
              awk '{for (field = 1; field <= NF; field++) if ($field == "dev") print $(field + 1)}' |
              sort -u
          )
          if [[ "${#egress_interfaces[@]}" -ne 1 ]]; then
            echo "Expected one IPv4 default-route interface, found ${#egress_interfaces[@]}" >&2
            exit 1
          fi
          egress_interface="${egress_interfaces[0]}"
          if [[ "$egress_interface" == "lxcbr0" ]] || ! ip link show dev "$egress_interface" >/dev/null; then
            echo "Invalid LXC egress interface: $egress_interface" >&2
            exit 1
          fi
          if [[ "$(sysctl -n net.ipv4.ip_forward)" != "1" ]]; then
            sudo sysctl -w net.ipv4.ip_forward=1
          fi
          sudo iptables -C FORWARD -i "$egress_interface" -o lxcbr0 -d "$lxc_subnet" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT ||
            sudo iptables -A FORWARD -i "$egress_interface" -o lxcbr0 -d "$lxc_subnet" -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
          sudo iptables -C FORWARD -i lxcbr0 -o "$egress_interface" -s "$lxc_subnet" -j ACCEPT ||
            sudo iptables -A FORWARD -i lxcbr0 -o "$egress_interface" -s "$lxc_subnet" -j ACCEPT
          sudo iptables -t nat -C POSTROUTING -s "$lxc_subnet" -o "$egress_interface" -j MASQUERADE ||
            sudo iptables -t nat -A POSTROUTING -s "$lxc_subnet" -o "$egress_interface" -j MASQUERADE
      - name: Run Linux unit and container-capable tests
        working-directory: source
        run: |
          mkdir -p ../out
          set -o pipefail
          git config --global gc.auto 0
          git config --global maintenance.auto false
          command_token="runner-test-$(python3 -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::stop-commands::$command_token"
          trap 'echo "::$command_token::"' EXIT
          go test -count=1 -race -v -timeout 45m ./... 2>&1 | tee ../out/linux-amd64-tests.log
      - name: Preserve Linux test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-tests-linux-amd64-${{ inputs.tag }}
          path: out/linux-amd64-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build deterministic Linux amd64 executable
        working-directory: source
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.source-epoch }}
          MODULE_PATH: ${{ needs.source.outputs.module-path }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p ../out
          version="${RELEASE_TAG#v}"
          go build -trimpath -buildvcs=false -tags 'netgo osusergo' \
            -ldflags "-s -w -buildid= -X ${MODULE_PATH}/internal/pkg/ver.version=${RELEASE_TAG}" \
            -o "../out/forgejo-runner-${version}-linux-amd64" .
      - name: Run version and configuration smoke checks
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 automation/scripts/creator-signal/smoke_binary.py
          --binary "out/forgejo-runner-${RELEASE_TAG#v}-linux-amd64"
          --tag "${RELEASE_TAG}"
          --config out/linux-amd64-config.yml
      - name: Generate deterministic SPDX SBOM
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.source-epoch }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: >-
          python3 automation/scripts/creator-signal/generate_go_sbom.py
          --binary "out/forgejo-runner-${RELEASE_TAG#v}-linux-amd64"
          --tag "${RELEASE_TAG}"
          --source-sha "${SOURCE_SHA}"
          --backport-commit "${BACKPORT_COMMIT}"
          --backport-patch-sha256 "${BACKPORT_PATCH_SHA256}"
          --patched-source-tree-sha "${PATCHED_SOURCE_TREE_SHA}"
          --output "out/forgejo-runner-${RELEASE_TAG#v}-linux-amd64.spdx.json"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-linux-amd64-candidate-${{ inputs.tag }}
          path: |
            out/forgejo-runner-*-linux-amd64
            out/forgejo-runner-*-linux-amd64.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-linux-arm64:
    name: Linux arm64 native build and smoke
    needs: source
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
          persist-credentials: false
      - name: Check out exact mirrored source tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out source commit
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
        run: test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Apply exact governed upstream source backport
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: >-
          python3 automation/scripts/creator-signal/apply_source_backport.py
          --source source
          --tag "${RELEASE_TAG}"
          --source-sha "${SOURCE_SHA}"
          --expected-commit "${BACKPORT_COMMIT}"
          --expected-patch-sha256 "${BACKPORT_PATCH_SHA256}"
          --expected-tree-sha "${PATCHED_SOURCE_TREE_SHA}"
      - name: Install exact declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.source.outputs.go-version }}
          cache-dependency-path: source/go.sum
      - name: Build deterministic Linux arm64 executable
        working-directory: source
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.source-epoch }}
          MODULE_PATH: ${{ needs.source.outputs.module-path }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p ../out
          version="${RELEASE_TAG#v}"
          go build -trimpath -buildvcs=false -tags 'netgo osusergo' \
            -ldflags "-s -w -buildid= -X ${MODULE_PATH}/internal/pkg/ver.version=${RELEASE_TAG}" \
            -o "../out/forgejo-runner-${version}-linux-arm64" .
      - name: Run version and configuration smoke checks natively
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 automation/scripts/creator-signal/smoke_binary.py
          --binary "out/forgejo-runner-${RELEASE_TAG#v}-linux-arm64"
          --tag "${RELEASE_TAG}"
          --config out/linux-arm64-config.yml
      - name: Generate deterministic SPDX SBOM
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.source-epoch }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: >-
          python3 automation/scripts/creator-signal/generate_go_sbom.py
          --binary "out/forgejo-runner-${RELEASE_TAG#v}-linux-arm64"
          --tag "${RELEASE_TAG}"
          --source-sha "${SOURCE_SHA}"
          --backport-commit "${BACKPORT_COMMIT}"
          --backport-patch-sha256 "${BACKPORT_PATCH_SHA256}"
          --patched-source-tree-sha "${PATCHED_SOURCE_TREE_SHA}"
          --output "out/forgejo-runner-${RELEASE_TAG#v}-linux-arm64.spdx.json"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-linux-arm64-candidate-${{ inputs.tag }}
          path: |
            out/forgejo-runner-*-linux-arm64
            out/forgejo-runner-*-linux-arm64.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-windows-amd64:
    # Windows artifacts are Creator Signal-tested; upstream-unsupported.
    name: Windows amd64 native build, tests and smoke
    needs: source
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
          persist-credentials: false
      - name: Check out exact mirrored source tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Verify checked-out source commit
        shell: pwsh
        env:
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
        run: |
          $actual = git -C source rev-parse HEAD
          if ($actual -ne $env:SOURCE_SHA) {
            throw "Source mismatch: expected $env:SOURCE_SHA, got $actual"
          }
      - name: Apply exact governed upstream source backport
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: |
          python automation/scripts/creator-signal/apply_source_backport.py `
            --source source `
            --tag "$env:RELEASE_TAG" `
            --source-sha "$env:SOURCE_SHA" `
            --expected-commit "$env:BACKPORT_COMMIT" `
            --expected-patch-sha256 "$env:BACKPORT_PATCH_SHA256" `
            --expected-tree-sha "$env:PATCHED_SOURCE_TREE_SHA"
      - name: Install exact declared Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.source.outputs.go-version }}
          cache-dependency-path: source/go.sum
      - name: Run native Windows runner tests without container features
        shell: pwsh
        working-directory: source
        run: |
          New-Item -ItemType Directory -Force -Path '..\out' | Out-Null
          $results = '..\out\windows-amd64-tests.log'
          # The upstream command tests temporarily capture os.Stdout. Go's
          # Windows structured test stream is incompatible with that capture and reports
          # a false package failure, so preserve a plain uncached transcript.
          $output = go test -p 2 -count=1 -short -timeout 45m ./internal/... -args -features '-' 2>&1
          $exitCode = $LASTEXITCODE
          $output | Set-Content -Path $results
          $output | Write-Output
          if ($exitCode -ne 0) { exit $exitCode }
      - name: Preserve Windows test results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-tests-windows-amd64-${{ inputs.tag }}
          path: out/windows-amd64-tests.log
          if-no-files-found: warn
          retention-days: 14
      - name: Build deterministic native Windows amd64 executable
        shell: pwsh
        working-directory: source
        env:
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.source-epoch }}
          MODULE_PATH: ${{ needs.source.outputs.module-path }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          New-Item -ItemType Directory -Force -Path '..\out' | Out-Null
          $version = $env:RELEASE_TAG.TrimStart('v')
          $ldflags = "-s -w -buildid= -X $env:MODULE_PATH/internal/pkg/ver.version=$env:RELEASE_TAG"
          go build -trimpath -buildvcs=false -tags 'netgo osusergo' -ldflags $ldflags `
            -o "..\out\forgejo-runner-$version-windows-amd64.exe" .
      - name: Run version and configuration smoke checks natively
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python automation/scripts/creator-signal/smoke_binary.py `
            --binary "out/forgejo-runner-$version-windows-amd64.exe" `
            --tag "$env:RELEASE_TAG" `
            --config out/windows-amd64-config.yml
      - name: Generate deterministic SPDX SBOM
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_DATE_EPOCH: ${{ needs.source.outputs.source-epoch }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          python automation/scripts/creator-signal/generate_go_sbom.py `
            --binary "out/forgejo-runner-$version-windows-amd64.exe" `
            --tag "$env:RELEASE_TAG" `
            --source-sha "$env:SOURCE_SHA" `
            --backport-commit "$env:BACKPORT_COMMIT" `
            --backport-patch-sha256 "$env:BACKPORT_PATCH_SHA256" `
            --patched-source-tree-sha "$env:PATCHED_SOURCE_TREE_SHA" `
            --output "out/forgejo-runner-$version-windows-amd64.exe.spdx.json"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-windows-amd64-candidate-${{ inputs.tag }}
          path: |
            out/forgejo-runner-*-windows-amd64.exe
            out/forgejo-runner-*-windows-amd64.exe.spdx.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  finalize:
    name: Assemble and verify qualified release bundle
    needs: [source, build-linux-amd64, build-linux-arm64, build-windows-amd64]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out trusted automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: automation
          persist-credentials: false
      - name: Download all qualified candidates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: runner-*-candidate-${{ inputs.tag }}
          path: rebuilt
          merge-multiple: true
      - name: Prepare deterministic release metadata and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          TAG_OBJECT_SHA: ${{ needs.source.outputs.tag-object-sha }}
          AUTOMATION_SHA: ${{ github.sha }}
          WORKFLOW_DEFINITION_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/.github/workflows/runner-qualification.yml
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: >-
          python3 automation/scripts/creator-signal/release_control.py prepare-release
          --directory rebuilt
          --tag "${RELEASE_TAG}"
          --source-sha "${SOURCE_SHA}"
          --tag-object-sha "${TAG_OBJECT_SHA}"
          --automation-sha "${AUTOMATION_SHA}"
          --workflow-url "${WORKFLOW_DEFINITION_URL}"
          --backport-commit "${BACKPORT_COMMIT}"
          --backport-patch-sha256 "${BACKPORT_PATCH_SHA256}"
          --patched-source-tree-sha "${PATCHED_SOURCE_TREE_SHA}"
      - name: Verify assembled asset contract
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          TAG_OBJECT_SHA: ${{ needs.source.outputs.tag-object-sha }}
          BACKPORT_COMMIT: ${{ needs.source.outputs.backport-commit }}
          BACKPORT_PATCH_SHA256: ${{ needs.source.outputs.backport-patch-sha256 }}
          PATCHED_SOURCE_TREE_SHA: ${{ needs.source.outputs.patched-source-tree-sha }}
        run: >-
          python3 automation/scripts/creator-signal/release_control.py verify-assets
          --directory rebuilt
          --tag "${RELEASE_TAG}"
          --source-sha "${SOURCE_SHA}"
          --tag-object-sha "${TAG_OBJECT_SHA}"
          --backport-commit "${BACKPORT_COMMIT}"
          --backport-patch-sha256 "${BACKPORT_PATCH_SHA256}"
          --patched-source-tree-sha "${PATCHED_SOURCE_TREE_SHA}"
      - name: Preserve qualified release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runner-qualified-release-${{ inputs.tag }}
          path: rebuilt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
