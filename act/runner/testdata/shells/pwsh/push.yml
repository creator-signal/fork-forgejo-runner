on: push
env:
  MY_SHELL: pwsh
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: code.forgejo.org/oci/ci:2
    steps:
      - shell: ${{ env.MY_SHELL }}
        run: |
          $PSVersionTable
  check-job-default:
    runs-on: ubuntu-latest
    container:
      image: code.forgejo.org/oci/ci:2
    defaults:
      run:
        shell: ${{ env.MY_SHELL }}
    steps:
      - run: |
          $PSVersionTable
