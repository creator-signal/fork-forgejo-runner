name: uses-docker-url
on: push
env:
  NODE_VERSION: 22
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: docker://code.forgejo.org/oci/node:22
        with:
          somekey: somevalue
          args: echo ${INPUT_SOMEKEY} | grep somevalue
      - uses: docker://code.forgejo.org/oci/node:22
        with:
          args: -v
      - uses: docker://code.forgejo.org/oci/node:22
        with:
          entrypoint: /bin/sh
          args: -c -- uname -a
      - uses: docker://code.forgejo.org/oci/node:22
        with:
          entrypoint: /bin/sh
          args: -c 'uname -a'
      - uses: docker://code.forgejo.org/oci/node:${{ env.NODE_VERSION }}
        with:
          entrypoint: /bin/sh
          args: -c 'echo "SUCCESS=OK" >> $FORGEJO_ENV'
      - run: |
          echo "SUCCESS=$SUCCESS"
          [[ "$SUCCESS" == "OK" ]] || exit 1