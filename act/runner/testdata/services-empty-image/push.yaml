name: services skip empty image
on: push
jobs:
  optional-service:
    runs-on: ubuntu-latest
    env:
      USE_OPTIONAL_SERVICE: 'false'
    services:
      conditional-db:
        image: ${{ env.USE_OPTIONAL_SERVICE == 'true' && 'code.forgejo.org/oci/postgres:16' || '' }}
        env:
          POSTGRES_PASSWORD: optional
        ports:
          - 5433:5432
    steps:
      - name: Assert optional service is skipped
        shell: bash
        run: |
          if timeout 2 bash -c '>/dev/tcp/conditional-db/5432' 2>/dev/null; then
            echo "ERROR: DB port is reachable, but service should have been skipped"
            exit 1
          fi
      - name: Confirm steps still run without the optional service
        run: echo "workflow continues even when the service is skipped"
