on:
  push:
  workflow_dispatch:
jobs:
  default-entrypoint:
    runs-on: docker
    container:
      image: 'nginx:latest'
    steps:
      - run: |
          entrypoint_cmd="$(cat /proc/1/comm)" 
          echo "entrypoint_cmd=$entrypoint_cmd"
          [[ "$entrypoint_cmd" == "tail" ]] || exit 1
